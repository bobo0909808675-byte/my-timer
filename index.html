<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>★ 個人佳牌計時器部落格 ★</title>
    <script src="https://unpkg.com/cursor-effects@latest/dist/browser.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        /* Y2K 核心排版與字體 */
        body {
            font-family: "PMingLiU", "新細明體", serif;
            background-color: #000000;
            background-image: url('https://blob.gifcities.org/gifcities/CQXODYFGDOQG6VAYZHLJPUNQJH3NFJXS.gif');
            background-repeat: repeat;
            color: #00FF00;
            margin: 0; padding: 0;
            cursor: crosshair;
            overflow-x: hidden;
        }

        .marquee-header {
            background-color: #FF00FF; color: #FFFF00;
            border-top: 5px solid #00FFFF; border-bottom: 5px solid #00FFFF;
            padding: 10px 0; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000;
        }

        .wrapper { display: table; width: 100%; max-width: 1000px; margin: 10px auto; background-color: rgba(0, 0, 0, 0.9); border: 8px ridge #FF0000; }

        .sidebar {
            display: table-cell; width: 30%; padding: 15px; vertical-align: top;
            background-color: #000080; border-right: 5px dashed #FFFF00; text-align: center;
        }

        .main-content { display: table-cell; width: 70%; padding: 20px; vertical-align: top; }

        h2 { color: #FF00FF; text-decoration: underline; background: #333; padding: 10px; border: 1px dotted #00FF00; margin-top: 0; }

        .control-panel { border: 3px double #00FFFF; padding: 15px; background: #111; margin-bottom: 20px; }
        .input-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 15px 0; }
        .input-box { display: flex; flex-direction: column; align-items: center; }
        .input-box input { width: 60px; height: 35px; background: #000; border: 2px solid #00FF00; color: #00FF00; text-align: center; font-family: 'Courier New'; }
        .input-box label { font-size: 12px; color: #FFFF00; margin-top: 5px; }

        select { background: #000; color: #FF00FF; border: 2px solid #FF00FF; padding: 5px; font-weight: bold; }

        .btn {
            border: 4px outset #888; background: #ccc; color: #000; padding: 10px 15px;
            cursor: pointer; font-weight: bold; text-transform: uppercase; margin: 5px;
        }
        .btn:active { border-style: inset; background: #aaa; }
        .btn-update { background: #FFFF00; color: #FF0000; border-color: #FF00FF; }
        .btn-stop { background: #FF0000; color: #fff; }
        .btn-start { background: #00FF00; color: #000; }

        /* 教學區塊樣式 */
        .guide-section {
            background: #000;
            border: 2px solid #00FF00;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        .guide-section code {
            background: #333;
            color: #FFFF00;
            padding: 2px 5px;
            border: 1px solid #555;
        }
        .guide-title {
            color: #00FFFF;
            font-weight: bold;
            border-bottom: 1px solid #00FFFF;
            margin-bottom: 10px;
            display: block;
        }

        #timer-view { display: none; height: 100vh; justify-content: center; align-items: center; background: transparent; }
        .rolling-timer { display: flex; font-size: 12vw; font-weight: 900; color: #00FF00; text-shadow: 5px 5px #FF00FF; }

        .blink { animation: blinker 0.6s linear infinite; color: #FF0000; background: #FFFF00; font-weight: bold; }
        @keyframes blinker { 50% { opacity: 0; } }

        .falling-item { position: fixed; top: -50px; z-index: 9999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

<script>
    const items = ['🥭', '💦', '💧', '✨', '⏰'];
    function createFallingItem() {
        const el = document.createElement('div');
        el.innerText = items[Math.floor(Math.random() * items.length)];
        el.className = 'falling-item';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (Math.random() * 24 + 12) + 'px';
        el.style.animationDuration = (Math.random() * 3 + 2) + 's';
        document.body.appendChild(el);
        setTimeout(() => { el.remove(); }, 5000);
    }
    setInterval(createFallingItem, 400);

    window.addEventListener("load", () => {
        new cursoreffects.rainbowCursor({ length: 15, colors: ["#FF0000", "#FFFF00", "#00FF00", "#00FFFF", "#FF00FF"], size: 4 });
    });
</script>

<div id="setup-view">
    <div class="marquee-header">
        <marquee scrollamount="10" behavior="alternate">
            <img src="https://blob.gifcities.org/gifcities/G2UQ43GLKGMYBC4TYHJQ2Y6WE7TERVMF.gif" height="30">
            ★·.·´¯`·.·★ 歡迎來到：雲端馬拉松同步計時控制台 ★·.·´¯`·.·★
            <img src="https://blob.gifcities.org/gifcities/G2UQ43GLKGMYBC4TYHJQ2Y6WE7TERVMF.gif" height="30">
        </marquee>
    </div>

    <div class="wrapper">
        <div class="sidebar">
            <h3 style="background:#FF0000; color:#fff;">★ 管理員資訊 ★</h3>
            <img src="https://blob.gifcities.org/gifcities/6G5YQUHZRCKNZOPJF334IGEHIHEQGAPK.gif" width="100">
            <p>狀態：<span class="blink">連線中...</span></p>
            <p style="font-size:12px;">此面板將即時同步至 OBS。</p>
            <hr color="#FF00FF">
            <button class="btn" id="copy-link" style="width:100%; font-size:12px; background:cyan;">點我複製 OBS 連結</button>
            <br><br>
            <select id="lang-selector">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <h2 id="title-start">1. 開啟新的計時階段</h2>
                <div class="input-group">
                    <div class="input-box"><input type="number" id="d" value="0"><label class="lbl-d">天</label></div>
                    <div class="input-box"><input type="number" id="h" value="10"><label class="lbl-h">時</label></div>
                    <div class="input-box"><input type="number" id="m" value="0"><label class="lbl-m">分</label></div>
                    <div class="input-box"><input type="number" id="s" value="0"><label class="lbl-s">秒</label></div>
                </div>
                <button class="btn btn-start" id="btn-start-session" style="width:100%;">⚡ 覆蓋並開啟新馬拉松 ⚡</button>
            </div>

            <div class="control-panel" style="border-color: #FFFF00;">
                <h2 id="title-mod">2. 增減雲端時間 (Modifier)</h2>
                <div style="text-align:center; margin-bottom: 10px;">
                    <select id="action">
                        <option value="add" id="opt-add">增加時間 (+)</option>
                        <option value="sub" id="opt-sub">減少時間 (-)</option>
                    </select>
                </div>
                <div class="input-group">
                    <div class="input-box"><input type="number" id="modd" value="0"><label class="lbl-d">天</label></div>
                    <div class="input-box"><input type="number" id="modh" value="0"><label class="lbl-h">時</label></div>
                    <div class="input-box"><input type="number" id="modm" value="0"><label class="lbl-m">分</label></div>
                    <div class="input-box"><input type="number" id="mods" value="0"><label class="lbl-s">秒</label></div>
                </div>
                <div style="display:flex; justify-content: space-around;">
                    <button class="btn btn-update" id="btn-update">💾 更新至雲端</button>
                    <button class="btn btn-stop" id="btn-toggle-timer">STOP</button>
                </div>
            </div>

            <div class="guide-section">
                <span class="guide-title">📖 基礎架設教學指南</span>
                1. 於資料夾開啟終端機輸入：<code>python -m http.server 8080</code><br>
                2. 透過 <b>Cloudflare Tunnel</b> 映射連接外網。<br>
                3. 在 OBS 中新增「瀏覽器來源」，解析度設為 <b>640*480</b>。<br>
                4. 貼上複製的同步連結即可看到計時器！
            </div>

            <p style="color:#aaa; font-size:12px; text-align:center; margin-top:20px;">製作人：果仁 & Gemini | 改造者：江北一</p>
        </div>
    </div>
</div>

<div id="timer-view"><div class="rolling-timer" id="rolling-timer"></div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBrer3en-IZymx-r6g4choU8kfKkfeQdNY",
        authDomain: "marathontimer.firebaseapp.com",
        databaseURL: "https://marathontimer-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "marathontimer",
        storageBucket: "marathontimer.firebasestorage.app",
        messagingSenderId: "753172401546",
        appId: "1:753172401546:web:8ccd5552daa22c274c0c73"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let params = new URLSearchParams(window.location.search);
    let timerId = params.get('id') || 'demo-y2k';
    const isWidget = params.get('mode') === 'timer';
    const timerRef = db.ref('timers/' + timerId);

    if (isWidget) {
        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('timer-view').style.display = 'flex';
        document.body.style.background = 'transparent';
        document.body.style.backgroundImage = 'none';
        timerRef.on('value', (s) => {
            const data = s.val(); if(!data) return;
            data.paused ? (updateDisplay(data.remaining), clearInterval(window.itv)) : startCountdown(data.endTime);
        });
    } else {
        const toggleBtn = document.getElementById('btn-toggle-timer');
        timerRef.on('value', (s) => {
            const data = s.val(); if(!data) return;
            toggleBtn.innerText = data.paused ? "START" : "STOP";
            toggleBtn.style.background = data.paused ? "#00FF00" : "#FF0000";
        });

        document.getElementById('btn-start-session').onclick = () => {
            const ms = (parseInt(document.getElementById('d').value)||0)*86400000 +
                       (parseInt(document.getElementById('h').value)||0)*3600000 +
                       (parseInt(document.getElementById('m').value)||0)*60000 +
                       (parseInt(document.getElementById('s').value)||0)*1000;
            timerRef.set({ endTime: Date.now() + ms, paused: false, remaining: ms });
        };

        document.getElementById('btn-update').onclick = () => {
            timerRef.once('value', (s) => {
                let d = s.val(); if(!d) return;
                let mod = (parseInt(document.getElementById('modd').value)||0)*86400000 +
                          (parseInt(document.getElementById('modh').value)||0)*3600000 +
                          (parseInt(document.getElementById('modm').value)||0)*60000 +
                          (parseInt(document.getElementById('mods').value)||0)*1000;
                let action = document.getElementById('action').value;
                if(d.paused) {
                    timerRef.update({ remaining: Math.max(0, action==='add' ? d.remaining+mod : d.remaining-mod) });
                } else {
                    timerRef.update({ endTime: action==='add' ? d.endTime+mod : d.endTime-mod });
                }
                ['modd', 'modh', 'modm', 'mods'].forEach(id => document.getElementById(id).value = 0);
            });
        };

        toggleBtn.onclick = () => {
            timerRef.once('value', (s) => {
                const data = s.val(); if(!data) return;
                data.paused ?
                    timerRef.update({ paused:false, endTime: Date.now() + Math.max(0, data.remaining) }) :
                    timerRef.update({ paused:true, remaining: Math.max(0, data.endTime - Date.now()) });
            });
        };

        document.getElementById('copy-link').onclick = () => {
            const syncLink = window.location.origin + window.location.pathname + `?id=${timerId}&mode=timer`;
            navigator.clipboard.writeText(syncLink).then(() => alert("✅ 同步連結已複製！"));
        };
    }

    function updateDisplay(ms) {
        if(ms < 0) ms = 0;
        const h = Math.floor(ms/3600000).toString().padStart(2,'0');
        const m = Math.floor((ms%3600000)/60000).toString().padStart(2,'0');
        const s = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
        document.getElementById('rolling-timer').innerText = `${h}:${m}:${s}`;
    }

    function startCountdown(endTime) {
        if(window.itv) clearInterval(window.itv);
        window.itv = setInterval(() => updateDisplay(endTime - Date.now()), 1000);
    }
</script>
</body>
</html>
